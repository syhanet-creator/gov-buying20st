<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b3d6e">
<title>조달청 공사 입찰 신규 20</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--tx:#1b2430;--sub:#6b7686;--pri:#0b3d6e;--acc:#e8590c;--line:#e3e8ef}
@media(prefers-color-scheme:dark){:root{--bg:#0f141b;--card:#18202a;--tx:#e8edf3;--sub:#93a0b2;--pri:#5aa2e6;--acc:#ff8a4c;--line:#263140}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--pri);color:#fff;padding:12px 16px calc(10px) ;padding-top:calc(12px + env(safe-area-inset-top))}
header h1{margin:0;font-size:18px}
.meta{font-size:12px;opacity:.85;margin-top:2px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:#4ade80;display:inline-block}
.dot.err{background:#f87171}
.tools{display:flex;gap:8px;margin-top:8px}
.tools input{flex:1;padding:8px 10px;border-radius:8px;border:0;font-size:14px}
.tools button{padding:8px 12px;border-radius:8px;border:0;background:#ffffff26;color:#fff;font-size:14px}
main{padding:12px;max-width:820px;margin:0 auto}
.banner{background:#fff4e6;color:#a04400;border:1px solid #ffd8a8;border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:13px}
.err-box{background:#ffe3e3;color:#a61e1e;border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:13px}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;text-decoration:none;color:inherit}
.card:active{opacity:.7}
.top{display:flex;gap:6px;align-items:center;margin-bottom:4px;flex-wrap:wrap}
.badge{font-size:11px;padding:2px 7px;border-radius:99px;background:var(--line);color:var(--sub)}
.badge.new{background:var(--acc);color:#fff;font-weight:700}
.badge.d{background:#e7f1fb;color:var(--pri)}
.badge.urgent{background:#ffe3e3;color:#c92a2a;font-weight:700}
.title{font-weight:700;font-size:15.5px;margin:2px 0 6px;word-break:keep-all}
.row{font-size:13px;color:var(--sub);display:flex;gap:4px 14px;flex-wrap:wrap}
.price{color:var(--tx);font-weight:700}
.empty{text-align:center;color:var(--sub);padding:40px 0}
</style>
</head>
<body>
<header>
  <h1>🏗️ 조달청 공사 입찰 신규 20</h1>
  <div class="meta"><span class="dot" id="dot"></span><span id="status">불러오는 중…</span><span id="count"></span></div>
  <div class="tools">
    <input id="q" type="search" placeholder="공고명·기관·지역 검색">
    <button id="reload">새로고침</button>
  </div>
</header>
<main>
  <div id="banner"></div>
  <div id="list"></div>
</main>
<script>
const REFRESH_MS = 60_000;
let items = [], seen = new Set(JSON.parse(localStorage.getItem('seenBids') || '[]')), firstLoad = !localStorage.getItem('seenBids');
const $ = (s) => document.querySelector(s);

const won = (n) => {
  if (!n) return '미공개';
  if (n >= 1e8) return (n / 1e8).toFixed(n % 1e8 ? 2 : 0).replace(/\.?0+$/, '') + '억원';
  if (n >= 1e4) return Math.round(n / 1e4).toLocaleString() + '만원';
  return n.toLocaleString() + '원';
};
const parse = (s) => s ? new Date(String(s).replace(' ', 'T') + '+09:00') : null;
const short = (s) => s ? String(s).slice(5, 16).replace('-', '/') : '-';
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function dday(closeAt) {
  const d = parse(closeAt); if (!d) return '';
  const diff = Math.ceil((d - new Date()) / 86400000);
  if (diff < 0) return '<span class="badge">마감</span>';
  if (diff <= 1) return `<span class="badge urgent">${diff === 0 ? 'D-DAY' : 'D-1'}</span>`;
  return `<span class="badge d">D-${diff}</span>`;
}

function render() {
  const kw = $('#q').value.trim().toLowerCase();
  const rows = items.filter((i) => !kw || [i.title, i.org, i.demand, i.region].join(' ').toLowerCase().includes(kw));
  $('#count').textContent = `· ${rows.length}건`;
  $('#list').innerHTML = rows.length ? rows.map((i) => `
    <a class="card" href="${esc(i.url) || '#'}" target="_blank" rel="noopener">
      <div class="top">
        ${i.isNew ? '<span class="badge new">NEW</span>' : ''}${dday(i.closeAt)}
        ${i.region ? `<span class="badge">${esc(i.region)}</span>` : ''}
        <span class="badge">${esc(i.no)}</span>
      </div>
      <div class="title">${esc(i.title)}</div>
      <div class="row">
        <span>🏢 ${esc(i.demand || i.org)}</span>
        <span class="price">💰 ${won(i.price)}</span>
        <span>게시 ${short(i.postedAt)}</span>
        <span>마감 ${short(i.closeAt)}</span>
      </div>
    </a>`).join('') : '<div class="empty">조건에 맞는 공고가 없습니다</div>';
}

async function load() {
  $('#status').textContent = '갱신 중…';
  try {
    const r = await fetch('/api/bids', { cache: 'no-store' });
    const j = await r.json();
    if (!r.ok || j.error) throw new Error(j.error || r.status);
    items = j.items.map((i) => ({ ...i, isNew: !firstLoad && !seen.has(i.no) }));
    j.items.forEach((i) => seen.add(i.no));
    localStorage.setItem('seenBids', JSON.stringify([...seen].slice(-500)));
    firstLoad = false;
    $('#dot').className = 'dot';
    $('#status').textContent = '최종 갱신 ' + new Date(j.updatedAt).toLocaleTimeString('ko-KR');
    $('#banner').innerHTML = j.demo ? '<div class="banner">⚠️ 샘플 데이터입니다. Vercel 환경변수 <b>DATA_GO_KR_KEY</b>에 공공데이터포털 인증키를 등록하면 실제 공고가 표시됩니다.</div>' : '';
    render();
  } catch (e) {
    $('#dot').className = 'dot err';
    $('#status').textContent = '갱신 실패';
    $('#banner').innerHTML = `<div class="err-box">불러오지 못했습니다: ${esc(e.message)}</div>`;
  }
}

$('#q').addEventListener('input', render);
$('#reload').addEventListener('click', load);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
setInterval(() => { if (!document.hidden) load(); }, REFRESH_MS);
load();
</script>
</body>
</html>
